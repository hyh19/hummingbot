# 三连阳/三连阴趋势策略配置文件

# ========== 交易所配置 ==========
# 交易所名称
exchange: binance_perpetual

# 交易对
trading_pair: BTC-USDT

# ========== K 线数据源配置 ==========
# K 线数据源交易所 (建议使用流动性好的交易所)
candles_exchange: binance_perpetual

# K 线数据源交易对
candles_pair: BTC-USDT

# K 线周期 (可选: 1m, 5m, 15m, 1h, 4h, 1d 等)
candles_interval: 1h

# K 线数据长度 (保留的 K 线数量，至少需要 3 根)
candles_length: 10

# ========== 策略参数 ==========
# 交易方向: LONG (仅做多) 或 SHORT (仅做空)
trade_direction: LONG

# K 线实体最小幅度百分比 (用于过滤假突破)
# 0.001 表示 0.1%，即 K 线实体至少要达到开盘价的 0.1%
min_candle_body_pct: 0.001

# 杠杆倍数
leverage: 50

# 每次开仓金额 (以 USDT 计价)
order_amount_quote: 10

# 持仓模式 (ONEWAY: 单向持仓, HEDGE: 双向持仓)
position_mode: ONEWAY

# ========== 风险管理参数 ==========
# 止损百分比 (0.02 表示 2%)
stop_loss: 0.02

# 止盈百分比 (0.015 表示 1.5%)
take_profit: 0.015

# ========== 实盘控制 ==========
# 是否为实盘交易 (true 表示执行真实下单)
is_live_trading: false
